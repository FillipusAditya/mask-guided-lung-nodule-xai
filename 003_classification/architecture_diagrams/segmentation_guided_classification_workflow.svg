<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Segmentation-Guided ResNet-50 Classification Workflow</title>
  <desc id="desc">End-to-end workflow from lung-parenchyma CT and U-Net probability maps through paired preprocessing, residual attention fusion, five-fold cross-validation, holdout ensemble evaluation, Grad-CAM, and LRP.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10243e"/>
      <stop offset="0.52" stop-color="#183b5b"/>
      <stop offset="1" stop-color="#14566a"/>
    </linearGradient>
    <linearGradient id="modelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243e" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#40566f"/>
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#16869a"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #d6e8f1; }
      .section { font-size: 19px; font-weight: 700; fill: #18324a; letter-spacing: 1px; }
      .box-title { font-size: 18px; font-weight: 700; fill: #17324d; }
      .box-text { font-size: 15px; font-weight: 400; fill: #395168; }
      .small { font-size: 13px; font-weight: 400; fill: #536b80; }
      .tiny { font-size: 12px; font-weight: 600; fill: #536b80; }
      .white-title { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .white-text { font-size: 14px; font-weight: 400; fill: #eef8fa; }
      .formula { font-family: 'DejaVu Sans Mono', monospace; font-size: 19px; font-weight: 700; fill: #542e85; }
      .arrow { fill: none; stroke: #40566f; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-teal { fill: none; stroke: #16869a; stroke-width: 3; marker-end: url(#arrowTeal); }
      .dash { fill: none; stroke: #8598aa; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f7fafc"/>
  <rect width="1920" height="104" fill="#173c5b"/>
  <text x="68" y="53" class="title">Segmentation-Guided ResNet-50 Classification</text>
  <text x="69" y="82" class="subtitle">Lung-parenchyma CT + U-Net probability guidance • 5-fold CV • holdout ensemble • explainability</text>
  <rect x="1653" y="25" width="205" height="54" rx="27" fill="#ffffff" fill-opacity="0.12" stroke="#bce8ee" stroke-opacity="0.7"/>
  <text x="1755" y="48" text-anchor="middle" class="white-text">Experiment profile</text>
  <text x="1755" y="69" text-anchor="middle" class="white-title">PARENCHYMA</text>

  <text x="62" y="145" class="section">1  INPUT &amp; PAIRED PREPROCESSING</text>

  <g filter="url(#shadow)">
    <rect x="66" y="170" width="280" height="142" rx="18" fill="#e9f8f7" stroke="#35a69d" stroke-width="2"/>
    <rect x="66" y="170" width="12" height="142" rx="6" fill="#16958d"/>
    <text x="100" y="207" class="box-title">Lung-parenchyma CT</text>
    <text x="100" y="237" class="box-text">ct_parenchyma/*.npy</text>
    <text x="100" y="263" class="small">Single 2D slice</text>
    <text x="100" y="286" class="small">Replicated to 3 channels</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="66" y="336" width="280" height="142" rx="18" fill="#fff5e8" stroke="#e49a2f" stroke-width="2"/>
    <rect x="66" y="336" width="12" height="142" rx="6" fill="#de8b16"/>
    <text x="100" y="373" class="box-title">U-Net probability map</text>
    <text x="100" y="403" class="box-text">probability_npy/*.npy</text>
    <text x="100" y="429" class="small">Continuous values [0, 1]</text>
    <text x="100" y="452" class="small">Same filename as metadata</text>
  </g>

  <path d="M346 241 C385 241 389 286 426 286" class="arrow-teal"/>
  <path d="M346 407 C385 407 389 329 426 329" class="arrow-teal"/>

  <g filter="url(#shadow)">
    <rect x="430" y="198" width="328" height="228" rx="20" fill="#edf6ff" stroke="#438cca" stroke-width="2"/>
    <text x="594" y="235" text-anchor="middle" class="box-title">Paired spatial transform</text>
    <line x1="462" y1="250" x2="726" y2="250" stroke="#b8d4ea" stroke-width="2"/>
    <text x="462" y="281" class="box-text">Resize CT + probability → 224×224</text>
    <text x="462" y="309" class="small">Linear interpolation for soft probability</text>
    <text x="462" y="337" class="small">Shared flip / rotation parameters</text>
    <text x="462" y="365" class="small">Intensity augmentation: CT only</text>
    <text x="462" y="393" class="small">ImageNet normalization: CT only</text>
  </g>

  <path d="M758 312 L817 312" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="822" y="238" width="214" height="148" rx="18" fill="#ffffff" stroke="#68809a" stroke-width="2"/>
    <text x="929" y="276" text-anchor="middle" class="box-title">Model input</text>
    <text x="929" y="309" text-anchor="middle" class="formula">[B, 4, 224, 224]</text>
    <text x="929" y="340" text-anchor="middle" class="small">3 CT channels</text>
    <text x="929" y="363" text-anchor="middle" class="small">+ 1 probability channel</text>
  </g>

  <text x="1090" y="145" class="section">2  GUIDED FEATURE FUSION</text>
  <rect x="1068" y="166" width="786" height="462" rx="24" fill="#f4f2ff" stroke="#7767b5" stroke-width="2.5"/>

  <rect x="1100" y="205" width="177" height="84" rx="14" fill="#dceeff" stroke="#3f84bc" stroke-width="2"/>
  <text x="1188" y="238" text-anchor="middle" class="box-title">CT branch</text>
  <text x="1188" y="264" text-anchor="middle" class="small">3 × 224 × 224</text>
  <path d="M1277 247 L1318 247" class="arrow"/>

  <rect x="1322" y="199" width="205" height="96" rx="14" fill="#dceeff" stroke="#3f84bc" stroke-width="2"/>
  <text x="1425" y="231" text-anchor="middle" class="box-title">ResNet-50</text>
  <text x="1425" y="255" text-anchor="middle" class="small">stem → layer1–3</text>
  <text x="1425" y="278" text-anchor="middle" class="tiny">F: 1024 × 14 × 14</text>

  <rect x="1100" y="358" width="177" height="84" rx="14" fill="#fff0da" stroke="#d88b1c" stroke-width="2"/>
  <text x="1188" y="391" text-anchor="middle" class="box-title">Guidance branch</text>
  <text x="1188" y="417" text-anchor="middle" class="small">1 × 224 × 224</text>
  <path d="M1277 400 L1318 400" class="arrow"/>

  <rect x="1322" y="340" width="205" height="120" rx="14" fill="#fff0da" stroke="#d88b1c" stroke-width="2"/>
  <text x="1425" y="370" text-anchor="middle" class="box-title">Attention encoder</text>
  <text x="1425" y="395" text-anchor="middle" class="small">resize 14×14 → Conv 3×3</text>
  <text x="1425" y="419" text-anchor="middle" class="small">GN + ReLU → Conv 1×1</text>
  <text x="1425" y="443" text-anchor="middle" class="tiny">sigmoid → A: 1024 × 14 × 14</text>

  <path d="M1527 247 C1560 247 1562 302 1592 316" class="arrow"/>
  <path d="M1527 400 C1560 400 1562 352 1592 338" class="arrow"/>

  <circle cx="1622" cy="328" r="47" fill="#eee7ff" stroke="#7356ad" stroke-width="3"/>
  <text x="1622" y="321" text-anchor="middle" class="box-title">Residual</text>
  <text x="1622" y="345" text-anchor="middle" class="box-title">fusion</text>

  <rect x="1322" y="510" width="305" height="76" rx="38" fill="#f1e9ff" stroke="#7c5ab4" stroke-width="2"/>
  <text x="1475" y="539" text-anchor="middle" class="formula">α = softplus(raw α) &gt; 0</text>
  <text x="1475" y="565" text-anchor="middle" class="small">initial α = 0.10 • configurable</text>
  <path d="M1570 510 C1592 476 1612 408 1620 379" class="dash"/>

  <path d="M1669 328 L1708 328" class="arrow"/>
  <rect x="1712" y="268" width="111" height="120" rx="14" fill="#e7f7ee" stroke="#45966c" stroke-width="2"/>
  <text x="1768" y="299" text-anchor="middle" class="box-title">Head</text>
  <text x="1768" y="325" text-anchor="middle" class="small">layer4</text>
  <text x="1768" y="348" text-anchor="middle" class="small">GAP</text>
  <text x="1768" y="371" text-anchor="middle" class="small">dropout + FC</text>

  <rect x="1551" y="458" width="271" height="48" rx="12" fill="#ffffff" stroke="#9d8bc9" stroke-width="1.5"/>
  <text x="1686" y="489" text-anchor="middle" class="formula">F′ = F × (1 + αA)</text>
  <text x="1768" y="420" text-anchor="middle" class="tiny">2 logits: benign / malignant</text>

  <text x="62" y="684" class="section">3  TRAINING, HOLDOUT TEST &amp; EXPLAINABILITY</text>

  <g filter="url(#shadow)">
    <rect x="66" y="716" width="270" height="206" rx="20" fill="#ffffff" stroke="#5e7489" stroke-width="2"/>
    <text x="201" y="754" text-anchor="middle" class="box-title">CV metadata</text>
    <text x="96" y="786" class="small">• Patient-group isolation</text>
    <text x="96" y="813" class="small">• Development folds: 0–4</text>
    <text x="96" y="840" class="small">• Holdout test: fold −1</text>
    <text x="96" y="867" class="small">• Labels: benign / malignant</text>
    <text x="96" y="894" class="small">• Ground-truth mask for XAI</text>
  </g>

  <path d="M336 819 L382 819" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="386" y="716" width="307" height="206" rx="20" fill="#eaf8ef" stroke="#439366" stroke-width="2"/>
    <text x="540" y="754" text-anchor="middle" class="box-title">5-fold cross-validation</text>
    <text x="420" y="786" class="small">Train 4 folds → validate 1 fold</text>
    <text x="420" y="813" class="small">Fresh model + optimizer per fold</text>
    <text x="420" y="840" class="small">Max 100 epochs</text>
    <text x="420" y="867" class="small">Early stop on validation loss</text>
    <text x="420" y="894" class="small">Track effective alpha each epoch</text>
  </g>

  <path d="M693 819 L739 819" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="743" y="716" width="273" height="206" rx="20" fill="#eef3ff" stroke="#5f75ba" stroke-width="2"/>
    <text x="880" y="754" text-anchor="middle" class="box-title">Per-fold outputs</text>
    <text x="778" y="786" class="small">• 5 best_model.pth</text>
    <text x="778" y="813" class="small">• Validation metrics</text>
    <text x="778" y="840" class="small">• OOF predictions</text>
    <text x="778" y="867" class="small">• Fold configurations</text>
    <text x="778" y="894" class="small">• Best learned alpha</text>
  </g>

  <path d="M1016 819 L1062 819" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1066" y="716" width="275" height="206" rx="20" fill="#fff4e8" stroke="#d58a28" stroke-width="2"/>
    <text x="1204" y="754" text-anchor="middle" class="box-title">Holdout ensemble</text>
    <text x="1100" y="786" class="small">Load all 5 best models</text>
    <text x="1100" y="813" class="small">Run untouched holdout slices</text>
    <text x="1100" y="840" class="small">Average fold probabilities</text>
    <text x="1100" y="867" class="small">Threshold malignant probability</text>
    <text x="1100" y="894" class="small">One final prediction per slice</text>
  </g>

  <path d="M1341 819 L1387 819" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1391" y="716" width="213" height="206" rx="20" fill="#eaf8f7" stroke="#2d978e" stroke-width="2"/>
    <text x="1498" y="754" text-anchor="middle" class="box-title">Evaluation</text>
    <text x="1423" y="790" class="small">Accuracy / loss</text>
    <text x="1423" y="817" class="small">Sensitivity</text>
    <text x="1423" y="844" class="small">Specificity / F1</text>
    <text x="1423" y="871" class="small">ROC-AUC</text>
    <text x="1423" y="898" class="small">Confusion matrix</text>
  </g>

  <path d="M1604 819 L1650 819" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1654" y="716" width="200" height="206" rx="20" fill="#fceef5" stroke="#bd608d" stroke-width="2"/>
    <text x="1754" y="754" text-anchor="middle" class="box-title">Explainability</text>
    <text x="1683" y="790" class="small">Grad-CAM</text>
    <text x="1683" y="817" class="small">LRP relevance</text>
    <text x="1683" y="844" class="small">Probability heatmap</text>
    <text x="1683" y="871" class="small">GT mask overlay</text>
    <text x="1683" y="898" class="small">Study visualizations</text>
  </g>

  <path d="M540 716 C540 650 1768 660 1768 426" class="dash"/>
  <text x="1067" y="659" text-anchor="middle" class="tiny">Each fold trains an independent instance of the guided architecture above</text>

  <rect x="66" y="968" width="1788" height="66" rx="16" fill="#153650"/>
  <text x="99" y="995" class="white-title">Key safeguards</text>
  <text x="99" y="1019" class="white-text">Paired filenames • finite arrays • probability ∈ [0,1] • synchronized geometry • patient-isolated folds • untouched holdout • alpha always positive</text>
  <text x="1816" y="1010" text-anchor="end" class="white-text">Input: [B,4,224,224]  →  Output: 2-class probability</text>
</svg>
